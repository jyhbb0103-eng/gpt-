name: Build Dabao Windows desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "dabao_agent_v2/desktop_app.py"
      - "dabao_agent_v2/app.py"
      - "dabao_agent_v2/requirements.txt"
      - "dabao_agent_v2/tests/test_desktop_app.py"
      - "dabao_agent_v2/启动桌面版大宝Agent.bat"
      - "dabao_agent_v2/构建桌面版EXE.bat"
      - ".github/workflows/dabao-desktop-build.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dabao_agent_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -r requirements.txt
      - run: .venv\Scripts\python.exe -m pip install pywebview
      - run: .venv\Scripts\python.exe -m pip install pyinstaller
      - run: .venv\Scripts\python.exe -m pytest -q
      - run: .venv\Scripts\python.exe desktop_app.py --self-test
      - run: >
          .venv\Scripts\python.exe -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name "大宝Agent"
          --collect-all webview
          desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: DabaoAgent-Windows
          path: |
            dabao_agent_v2/dist/大宝Agent.exe
            dabao_agent_v2/启动桌面版大宝Agent.bat
          if-no-files-found: error
