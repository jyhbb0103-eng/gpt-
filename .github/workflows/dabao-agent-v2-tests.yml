name: Dabao Agent 2.0 tests

on:
  push:
    paths:
      - "dabao_agent_v2/**"
      - ".github/workflows/dabao-agent-v2-tests.yml"
  pull_request:
    paths:
      - "dabao_agent_v2/**"
      - ".github/workflows/dabao-agent-v2-tests.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dabao_agent_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
